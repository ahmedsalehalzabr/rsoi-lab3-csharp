version: '3.8'
services:
  flight-service:
    build: ./src/FlightService
    ports:
      - "8081:8080"
  ticket-service:
    build: ./src/TicketService
    ports:
      - "8082:8080"
  airline-service:
    build: ./src/AirlineService
    ports:
      - "8083:8080"
  gateway-service:
    build: ./src/GatewayService
    ports:
      - "8080:8080"
    depends_on:
      - flight-service
      - ticket-service
      - airline-service