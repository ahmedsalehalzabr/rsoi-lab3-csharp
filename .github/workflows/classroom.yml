name: GitHub Classroom Workflow

on: [push]

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build RsoiLab3.sln --configuration Release

      - name: Test
        run: dotnet test RsoiLab3.sln --configuration Release --no-build

      - name: Run Autograding
        uses: education/autograding@v1
        id: autograder
        continue-on-error: true
